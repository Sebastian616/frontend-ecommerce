<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Panel Orbisa</title>

<!-- ═══════ GUARDIA DE ACCESO ═══════
     Se ejecuta ANTES de cargar cualquier otra cosa. Si no hay sesión de admin
     (o no hay token de la API), redirige de inmediato. La seguridad real está
     en el backend: solo el rol ADMIN puede ver todos los pedidos. -->
<script>
(function () {
  try {
    var token = localStorage.getItem('orbisa_token');
    var raw = localStorage.getItem('orbisa_session');
    var session = raw ? JSON.parse(raw) : null;
    if (!token || !session) {
      location.replace('login.html');
    } else if (session.role !== 'admin') {
      location.replace('index.html');
    }
  } catch (e) {
    location.replace('login.html');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@200;300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
