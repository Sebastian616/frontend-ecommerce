<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda — Orbisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@200;300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/index.css">
<link rel="stylesheet" href="./css/navbar.css">
<link rel="stylesheet" href="./css/products.css">
<link rel="stylesheet" href="./css/shop.css">
<link rel="stylesheet" href="./css/footer.css">
<link rel="stylesheet" href="./css/cart.css">
<link rel="stylesheet" href="./css/product-modal.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="./img/logotransparente.png">
</head>
<body>

<!-- ═══════ ANNOUNCEMENT BAR ═══════ -->
<div class="announce-bar">🚚 Envío gratis en compras superiores a $100.000 COP</div>

<!-- ═══════ BRAND MARK ═══════ -->
<div class="brand-mark" aria-hidden="true">
    <img src="./img/logotransparente.png" alt="">
    Orb<em>Isa</em>
</div>

<!-- ═══════ FLOATING PILL NAV ═══════ -->
<div id="navbar"></div>

<!-- ═══════ MOBILE ═══════ -->
<button class="hamburger" aria-label="Abrir menú"><span></span><span></span><span></span></button>
<nav class="mobile-nav" aria-label="Navegación móvil">
  <a href="index.html#hero">Inicio</a>
  <a href="productos.html" class="active">Tienda</a>
  <a href="index.html#productos">Colecciones</a>
  <a href="index.html#promo">Nosotros</a>
  <a href="index.html#newsletter">Contacto</a>
  <button class="mobile-cart-btn cart-open-btn" id="cartTriggerMobile" aria-label="Abrir carrito de compras" aria-haspopup="dialog" aria-controls="cartModal">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Ver carrito
    <span class="cart-count">0</span>
  </button>
</nav>

<!-- ═══════ SHOP HEADER ═══════ -->
<header class="shop-header">
  <div class="shop-eyebrow">Catálogo completo</div>
  <h1 class="shop-title">Todos los productos</h1>
  <div class="shop-count" id="shopCount"></div>
</header>

<!-- ═══════ SHOP GRID (renderizado desde localStorage) ═══════ -->
<section class="flow-section products" aria-live="polite">
  <div class="products-grid" id="shopGrid">
    <!-- products.js llena esto dinámicamente -->
  </div>
</section>

<!-- ═══════ FOOTER ═══════ -->
<div id="footer"></div>

<!-- ═══════ MODAL DE FOTOS DEL PRODUCTO ═══════ -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="productCarousel" class="carousel slide" data-bs-ride="false">
          <div class="carousel-indicators" id="productCarouselIndicators"></div>
          <div class="carousel-inner" id="productCarouselInner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/products.js"></script>
<script src="./js/index.js"></script>
</body>
</html>
